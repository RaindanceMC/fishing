id: fishing-market
title: Big fish, rare fish, fish to sell
summary: "The tug of war with legendary fish, rare variants, the fishmonger and aquariums."
intro: |
  What happens after the bite: fighting the big ones, the rare colours any fish can come in, selling your catch and keeping your favourites.
icon: TROPICAL_FISH
category: Progress & rewards
order: 36
