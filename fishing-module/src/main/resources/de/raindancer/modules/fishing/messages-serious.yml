# The serious wording for this module: the same keys as messages.yml, said plainly,
# for a server whose Message tone (Core's /settings, Appearance) is SERIOUS.
# Only lines that differ are here; every other key keeps its one wording in both tones.
# A line the owner rewrote in plugins/RainsCore/messages.yml wins in both tones.

fishing:
  caught:
    fish: "<green>Caught: <white><fish></white>, <white><weight></white> <gray>(<tier>)</gray>."
    double: "<green>Double catch: <white><fish></white>."
  chest:
    one-at-a-time: "<red>Wait until the current chest has opened."
    place-it: "<gray>Place the chest first, then right click it to open it."
  dish:
    eaten: "<green><white><dish></white> eaten; its effects are active."
  line:
    void-needed: "<gray>A Void Line is needed to fish the void."
  give:
    bad-item: "<red><item> is not a known item. Examples: fish:pebble_trout, dish:fish_skewer, chest:void, rod:reef."
