# Rain's Fishing: every line this module says.
#
# Offered as a *floor*: anything an owner has already written in their own messages.yml wins. See
# Messages.defineFrom. Every placeholder a line asks for is supplied where it is sent, and nothing
# here is YAML's idea of a truth value.
fishing:

  usage: "<gray>/fishing [rods|skills|rod|collection]  ·  /fishing give <player> <fish:id[:variant]|dish:id|chest:tier|rod:tier|bait:id|aquarium> [amount]  ·  /fishing merchant [remove]  ·  /fishing xp <player> <amount>  ·  /fishing spot"
  only-a-player: "<red>Only a player standing in the world can do that."
  level-up: "<green>Fishing level <white><level></white>. You have <white><points></white> skill point(s) to spend: <white>/fishing skills</white>."

  merchant:
    nothing: "<gray>You have no fish to sell."
    sold: "<green>The fishmonger took <white><count></white> fish for <gold><money></gold>."
    cannot-pay: "<red>The fishmonger cannot pay right now, so your fish stay with you."
    placed: "<green>A fishmonger stands here now. Right click him to sell fish."
    removed: "<green>The fishmonger is gone."
    none-near: "<red>No fishmonger within four blocks."
    usage: "<gray>/fishing merchant [remove]"
    not-allowed: "<red>You may not place fishmongers."

  aquarium:
    placed: "<green>Aquarium set down. Right click it to open it, or with a fish in hand to put the fish in. Tanks side by side join into one."
    added: "<green><white><fish></white> is swimming in the aquarium now."
    full: "<red>The aquarium is full. <most> fish fit in it; set another tank down beside it for more room."
    only-fish: "<red>Only fish go into an aquarium."
    no-fish: "<gray>You carry no fish."
    how: "<gray>Right click to open the aquarium. Sneak and left click to pick a tank up with its fish."
    not-allowed-open: "<red>You may not open containers here, so not this aquarium either."
    not-allowed-take: "<red>You may not break blocks here, so you cannot pick this tank up."
    gone: "<gray>The aquarium is out of reach now."

  tug:
    start: "<gold>A <white><fish></white> fish is on the line! Hold right click to reel, and let go when it runs."
    pulled-in: "<red>The <white><fish></white> was stronger and pulled you in."
    tore-free: "<red>The <white><fish></white> was stronger and tore free."
    snapped: "<red>Your line snapped. The <white><fish></white> is gone."
    escaped: "<gray>The <white><fish></white> got away."

  duo:
    complete: "<light_purple>Duo complete: <white><title></white>. It shows as your title in chat now. You can switch it off on the cosmetics Tags page."

  menu:
    not-allowed: "<red>You may not open the fishing pages."

  caught:
    fish: "<green>Caught: <white><fish></white>, <white><weight></white> <gray>(<tier>)</gray>."
    weighed: "<fish> <gray>·</gray> <white><weight></white>"
    weighed-stall: "<fish> <gray>·</gray> <white><weight></white> <gray>·</gray> <gold>+<money></gold>"
    record: "<gold>New personal best: a <white><weight></white> <white><fish></white>."
    double: "<green>Double catch: <white><fish></white>."
    triple: "<green>Triple catch: <white><fish></white>."
    mutation: "<light_purple>A rare variant: <white><fish></white>. It is worth <white><factor>×</white> a plain one."
    chest: "<gold>A <white><chest></white> came up on your line. Place it somewhere and right click it to open it."

  mutation:
    broadcast: "<gold><white><player></white> landed a <light_purple><bold><fish></bold></light_purple> <gray>(<tier>, <weight>)</gray>."

  mythic:
    broadcast: "<gold><white><player></white> landed a <aqua><bold>mythic</bold></aqua> <white><fish></white> <gray>(<weight>)</gray>."

  whopper:
    broadcast: "<gold><white><player></white> landed a whopping <white><weight></white> <white><fish></white> <gray>(<tier>)</gray>."
    w: "<green><bold>[W]</bold></green>"
    w-tooltip: "<gray>Congratulate them"
    got-w: "<green><white><player></white> gave you a <bold>W</bold> for that <white><fish></white>."
    gave-w: "<gray>You gave <white><player></white> a <bold>W</bold>."

  auto:
    away: "<gray>Auto-Rethrow rests while you are away. Cast by hand to start it again."
    still: "<gray>Auto-Rethrow paused after 30 casts without looking around. Look around or cast by hand to resume."
  line:
    burnt: "<red>Your Silk Line burnt through in the lava. Fit an <white>Ember Line</white> to fish lava."
    void-needed: "<gray>A <white>Void Line</white> is needed to fish the void."

  chest:
    not-allowed: "<red>You may not open sea chests."
    one-at-a-time: "<red>Wait until the current chest has opened."
    placed: "<gray>Your <white><chest></white> is down. Right click it to open it; sneak and left click to take it back."
    place-it: "<gray>Place the chest first, then right click it to open it."
    not-yours: "<red>That sea chest is somebody else's catch."
    opened: "<green>The <white><chest></white> held <white><count></white> thing(s), now in your bag."
    money: "<green>…and <white><money></white>, straight to your balance."

  dish:
    eaten: "<green><white><dish></white> eaten; its effects are active."
    cook-a-dish: "<gray>A <white><fish></white> is cooked into a dish, not on its own. See the recipe book."

  rod:
    hold-a-rod: "<red>Hold the fishing rod you want to upgrade in your main hand."
    one-rod: "<red>Upgrade one rod at a time. Hold a single rod, not a stack."
    maxed: "<red>The <white><part></white> on this rod cannot go any higher."
    level-too-low: "<red><white><part></white> needs fishing level <white><level></white>. Keep fishing."
    not-enough: "<red>That needs <white><cost></white> fishing experience, and you have <white><have></white> to spend. Keep fishing."
    upgraded: "<green>Fitted: <white><part></white>, for <white><cost></white> fishing experience."
    moved: "<red>The rod left your hand before the upgrade went on, so your experience went back to you."

  rods:
    unlocked: "<green>The <white><rod></white> is unlocked for <white><cost></white> fishing experience. Its recipe is in your recipe book now."
    already: "<red>You unlocked the <white><rod></white> already. Its recipe is in your recipe book."
    previous-first: "<red>Unlock the <white><previous></white> before the <white><rod></white>."
    level-too-low: "<red>The <white><rod></white> needs fishing level <white><level></white>. Keep fishing."
    not-enough: "<red>The <white><rod></white> needs <white><cost></white> fishing experience, and you have <white><have></white> to spend."
    not-yours: "<red>The <white><rod></white> is not unlocked for you yet. See <white>/fishing rods</white>."

  tree:
    learnt: "<green><white><node></white> is now rank <white><rank></white>."
    refused: "<red><white><node></white>: <reason>"

  skills:
    learnt: "<green><white><skill></white> is now rank <white><rank></white>."
    maxed: "<red><white><skill></white> is at its highest rank already."
    no-points: "<red>No skill point left for <white><skill></white>. Every fishing level gives one."
    nothing-to-unlearn: "<red>You have not learnt any fishing skill yet."
    reset-not-paid: "<red>Unlearning costs <white><price></white>, and it could not be taken."
    reset-failed: "<red>Your skills could not be reset, and your money went back to you."
    reset: "<green>Skill tree reset. <white><points></white> point(s) to spend again."

  screen:
    you: "<aqua><bold>Your fishing</bold></aqua><newline><gray>Level <white><level></white> · <white><next></white> experience to the next<newline><gray>Fish landed: <white><landed></white> · kinds <white><kinds></white>/<white><of></white><newline><gray>Heaviest: <white><best></white><newline><gray>Sea chests opened: <white><chests></white>"
    top: "<aqua><bold>Fishing leaderboard</bold></aqua>"
    heaviest: "<aqua><bold>Heaviest catches</bold></aqua>"
    landed: "<aqua><bold>Most fish landed</bold></aqua>"
    collectors: "<aqua><bold>Fish collectors</bold></aqua>"
    row: "<gold><place>.</gold> <white><player></white> <gray>: <value></gray>"
    nobody: "<gray>Nobody has fished here yet."

  nospot:
    usage: "<gray>/fishing nospot add <name> [radius]<dark_gray>: a square around you · <gray>/fishing nospot add <name> <x1> <z1> <x2> <z2> · /fishing nospot remove <name> · /fishing nospot list"
    added: "<green>No fishing spot comes up on its own in <white><name></white> now: x <white><x1></white>..<white><x2></white>, z <white><z1></white>..<white><z2></white>."
    taken: "<red>There is already a no-spot zone called <white><name></white>."
    removed: "<green>Fishing spots may come up in <white><name></white> again."
    not-found: "<red>No no-spot zone called <white><name></white> here."
    none: "<gray>No no-spot zones in this world."
    list: "<gray>No-spot zones in this world (<white><count></white>):"
    line: "<white><name></white> <gray>x <x1>..<x2>, z <z1>..<z2> · <distance> blocks away"
  spot:
    sign: "Fishing Spot<newline><white><shoal></white><newline><gray><chest> can bite here</gray>"
    not-allowed: "<red>Only staff can place a fishing spot."
    look-at-water: "<red>Look at water or lava, or in the End out into the void."
    placed: "<green>A fishing spot is out on the <white><water></white>."
    taken: "<red>Another fishing spot already covers that water."
    usage: "<gray>/fishing spot  ·  /fishing spot create <tier> [radius 1-32]  ·  /fishing spot list  ·  /fishing spot remove [id]"
    void-only: "<red>A Void Shoal only ever hangs over the void."
    fixed: "<green>A fixed <white><shoal></white> is out on the <white><water></white>, <white><radius></white> blocks round, for good. <dark_gray>(<id>)"
    none: "<gray>No fixed fishing spots in this world."
    list: "<gold>Fixed fishing spots here: <white><count></white>"
    line: "<dark_gray><id></dark_gray> <white><shoal></white> <gray>· <water> · <radius> blocks round · <x> <y> <z> · <distance> blocks away"
    not-found: "<red>No fixed fishing spot like that here. Stand within 32 blocks of one, or give its id from /fishing spot list."
    removed: "<green>The fixed <white><shoal></white> is gone for good. <dark_gray>(<id>)"

  skin:
    not-yours: "<red>The <white><skin></white> skin is not yours yet. <gray><how>"
    hold-a-rod: "<red>Hold the rod you want to dress in your main hand."
    worn: "<green>Your rod now wears <white><skin></white>."
    off: "<gray>Your rod shows as itself again."
    unlocked: "<gold>The <white><skin></white> rod skin is unlocked. <gray>Put it on in /fishing rod."
    already: "<gray>You already have the <white><skin></white> skin; keep the token to trade it."
    try-again: "<red>That did not go through, but your token is back. Try again in a moment."
    supporters: "<light_purple>Wearing a rod skin is a thank-you for <who>. <gray>You keep every skin you earn and can wear them once you are one of them: <white><where></white>."

  net:
    only-fish: "<red>Only fish go into a fishing net."
    full: "<yellow>The net is full; the rest stays with you."
    bag-full: "<yellow>Your inventory is full; the rest stays in the net."
    no-fish: "<gray>You carry no fish to put in."

  give:
    not-allowed: "<red>Only staff can hand out fish, dishes and sea chests."
    unknown: "<red>Nobody called <player> is online here."
    bad-item: "<red><item> is not a known item. Examples: fish:pebble_trout, dish:fish_skewer, chest:void, rod:reef, bait:wriggler."
    bad-amount: "<red><amount> is not an amount."
    given: "<green>Gave <white><amount>× <item></white> to <white><count></white> player(s)."
    experience: "<green>Gave <white><amount></white> fishing experience to <white><count></white> player(s)."
