  star_lure: {branch: ember, at: [3, 2], title: Star Lure, icon: end_rod, ranks: 3, requires: [void_path, hot_lore], perks: {void_chest: 5}}
  lava_wader: {branch: ember, at: [4, 0], title: Lava Wader, icon: lava_bucket, ranks: 2, requires: [magma_lure], perks: {lava_wait: 5}}
  abyss_walker: {branch: ember, at: [4, 1], title: Abyss Walker, icon: dragon_head, capstone: true, cost: 3, level: 60, requires: [magma_lure, nether_instinct, star_lure], perks: {hot_xp: 50, hot_rare: 20}}
