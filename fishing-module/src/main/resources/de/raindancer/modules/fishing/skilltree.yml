# The fishing skill tree. Five branches, each filling five columns by three rows (at: [column, row]) and ending in a
# free mastery badge right of its capstone, open once the rest of the branch is taken; a node needs ONE of
# what it `requires` (a neighbour in its branch, which the menu joins with a line) and is shut while one of what it
# `excludes` is taken. `effects` are per rank, by perk id (see Perk.java for what each means); `cost` is skill points per rank.
# `legacy` carries the old skill of that name over, rank for rank.
branches:
  tidecaller:
    title: Tidecaller
    icon: heart_of_the_sea
    blurb: Fish bite sooner, in spots, in the rain.
  treasure:
    title: Treasure Hunter
    icon: chest
    blurb: More sea chests, better ones, fuller ones.
  collector:
    title: Collector
    icon: tropical_fish
    blurb: Rarer fish, heavier fish.
  ember:
    title: Ember & Void
    icon: magma_cream
    blurb: Fishing lava and the void.
  monger:
    title: Fishmonger
    icon: emerald
    blurb: Double catches, bait, money and the kitchen.

