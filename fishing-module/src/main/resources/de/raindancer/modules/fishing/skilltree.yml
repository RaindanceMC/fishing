  giant_hunter: {branch: collector, at: [3, 0], title: Giant Hunter, icon: iron_block, ranks: 3, requires: [trophy_hunter, field_notes], perks: {weight: 4}}
  legend_lure: {branch: collector, at: [3, 1], title: Legend Lure, icon: nether_star, ranks: 3, requires: [field_notes], perks: {legend: 10}}
  jewel_eye: {branch: collector, at: [3, 2], title: Jewel Eye, icon: diamond, ranks: 3, requires: [sharp_eye, field_notes], perks: {epic: 6}}
  record_breaker: {branch: collector, at: [4, 0], title: Record Breaker, icon: gold_ingot, ranks: 2, requires: [giant_hunter], perks: {weight: 5}}
  legend_seeker: {branch: collector, at: [4, 1], title: Legend Seeker, icon: dragon_breath, capstone: true, cost: 3, level: 60, requires: [giant_hunter, legend_lure, jewel_eye], perks: {legend: 50, rare: 10}}
  myth_lure: {branch: collector, at: [4, 2], title: Myth Lure, icon: end_crystal, ranks: 2, requires: [jewel_eye], perks: {legend: 8}}

