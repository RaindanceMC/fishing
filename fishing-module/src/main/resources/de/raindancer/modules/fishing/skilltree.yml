# The fishing skill tree. Five branches, each five columns by three rows (at: [column, row]); a node needs ONE of
# what it `requires` (a neighbour in its branch, which the menu joins with a line) and is shut while one of what it
# `excludes` is taken. `perks` are per rank (see Perk.java for what each means); `cost` is skill points per rank.
# `legacy` carries the old skill of that name over, rank for rank.
branches:
  tidecaller:
    title: Tidecaller
    icon: heart_of_the_sea
    blurb: Fish bite sooner, in spots, in the rain.
  treasure:
    title: Treasure Hunter
    icon: chest
    blurb: More sea chests, better ones, fuller ones.
  collector:
    title: Collector
    icon: tropical_fish
    blurb: Rarer fish, heavier fish.
  ember:
    title: Ember & Void
    icon: magma_cream
    blurb: Fishing lava and the void.
  monger:
    title: Fishmonger
    icon: emerald
    blurb: Double catches, bait, money and the kitchen.

nodes:
  # ---------------------------------------------------------------- Tidecaller
  quick_bite: {branch: tidecaller, at: [0, 1], title: Quick Bite, icon: clock, ranks: 5, perks: {wait: 6}, legacy: quick_bite}
  swift_reel: {branch: tidecaller, at: [1, 0], title: Swift Reel, icon: fishing_rod, ranks: 3, requires: [quick_bite], perks: {wait: 3}}
  spot_reader: {branch: tidecaller, at: [1, 2], title: Spot Reader, icon: spyglass, ranks: 3, requires: [quick_bite], perks: {spot_wait: 8}}
  shoal_sense: {branch: tidecaller, at: [2, 1], title: Shoal Sense, icon: prismarine_crystals, ranks: 3, requires: [swift_reel, spot_reader], perks: {spot_rare: 10}}
  patience: {branch: tidecaller, at: [2, 0], title: Patience, icon: recovery_compass, choice: true, cost: 2, requires: [swift_reel], excludes: [frenzy], perks: {wait: -20, rare: 25}}
  frenzy: {branch: tidecaller, at: [2, 2], title: Frenzy, icon: blaze_powder, choice: true, cost: 2, requires: [spot_reader], excludes: [patience], perks: {wait: 20, rare: -10}}
  rain_dancer: {branch: tidecaller, at: [3, 0], title: Rain Dancer, icon: water_bucket, ranks: 3, requires: [patience, shoal_sense], perks: {storm_wait: 10}}
  tide_lore: {branch: tidecaller, at: [3, 1], title: Tide Lore, icon: book, ranks: 3, requires: [shoal_sense], perks: {xp: 5}}
  quick_hands: {branch: tidecaller, at: [3, 2], title: Quick Hands, icon: lead, ranks: 3, requires: [frenzy, shoal_sense], perks: {double: 20}}
  deep_current: {branch: tidecaller, at: [4, 0], title: Deep Current, icon: nautilus_shell, ranks: 2, requires: [rain_dancer], perks: {rare: 5}}
  stormcaller: {branch: tidecaller, at: [4, 1], title: Stormcaller, icon: trident, capstone: true, cost: 3, level: 60, requires: [rain_dancer, tide_lore, quick_hands], perks: {wait: 15, storm_wait: 25}}
  twin_tides: {branch: tidecaller, at: [4, 2], title: Twin Tides, icon: lily_pad, ranks: 2, requires: [quick_hands], perks: {double: 30}}

  # ---------------------------------------------------------------- Treasure Hunter
  treasure_sense: {branch: treasure, at: [0, 1], title: Treasure Sense, icon: compass, ranks: 5, perks: {chest: 10}, legacy: treasure_sense}
  lucky_lid: {branch: treasure, at: [1, 0], title: Lucky Lid, icon: rabbit_foot, ranks: 3, requires: [treasure_sense], perks: {chest_roll: 10}}
  heavy_purse: {branch: treasure, at: [1, 2], title: Heavy Purse, icon: bundle, ranks: 3, requires: [treasure_sense], perks: {chest_money: 8}}
  better_chests: {branch: treasure, at: [2, 1], title: Better Chests, icon: ender_chest, ranks: 3, requires: [lucky_lid, heavy_purse], perks: {chest_up: 4}}
  gambler: {branch: treasure, at: [2, 0], title: Gambler, icon: dropper, choice: true, cost: 2, requires: [lucky_lid], excludes: [hoarder], perks: {chest_roll: 40, chest_money: -20}}
  hoarder: {branch: treasure, at: [2, 2], title: Hoarder, icon: gold_block, choice: true, cost: 2, requires: [heavy_purse], excludes: [gambler], perks: {chest_money: 40, chest_roll: -10}}
  deep_lure: {branch: treasure, at: [3, 0], title: Deep Lure, icon: prismarine_shard, ranks: 3, requires: [gambler, better_chests], perks: {chest: 5}}
  spot_treasure: {branch: treasure, at: [3, 1], title: Treasure Spots, icon: map, ranks: 3, requires: [better_chests], perks: {spot_chest: 10}}
  gilded_coins: {branch: treasure, at: [3, 2], title: Gilded Coins, icon: gold_nugget, ranks: 3, requires: [hoarder, better_chests], perks: {chest_money: 5}}
  map_reader: {branch: treasure, at: [4, 0], title: Map Reader, icon: filled_map, ranks: 2, requires: [deep_lure], perks: {chest_roll: 10}}
  krakens_hoard: {branch: treasure, at: [4, 1], title: "Kraken's Hoard", icon: heart_of_the_sea, capstone: true, cost: 3, level: 60, requires: [deep_lure, spot_treasure, gilded_coins], perks: {chest_up: 10, chest: 10}}
  golden_hook: {branch: treasure, at: [4, 2], title: Golden Hook, icon: golden_apple, ranks: 2, requires: [gilded_coins], perks: {chest_money: 10}}

  # ---------------------------------------------------------------- Collector
