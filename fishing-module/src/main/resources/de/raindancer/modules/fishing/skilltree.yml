  field_notes: {branch: collector, at: [2, 1], title: Field Notes, icon: writable_book, ranks: 3, requires: [heavy_hands, keen_eye], perks: {xp: 6}}
  trophy_hunter: {branch: collector, at: [2, 0], title: Trophy Hunter, icon: item_frame, choice: true, cost: 2, requires: [heavy_hands], excludes: [sharp_eye], perks: {weight: 20}}
